name: "Release Generator"

on:
  push:
    branches: [ master ]

jobs:
  release:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for tag detection and changelog

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v5
        id: setup-gradle
        with:
          gradle-version: release-candidate

      - name: Cache bundled JRE
        uses: actions/cache@v4
        with:
          path: build/libs/jre
          key: jre-temurin-21-windows-x64

      - name: Install Launch4J
        run: |
          curl -fsSL "https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50-linux-x64.tgz/download" -o launch4j.tgz
          tar -xzf launch4j.tgz -C "$HOME"
          chmod +x "$HOME/launch4j/launch4j"
          chmod +x "$HOME/launch4j/bin/"*
          echo "LAUNCH4J_DIR=$HOME/launch4j" >> $GITHUB_ENV

      # ── Artifacts ────────────────────────────────────────────────────────────
      - run: gradle shadowJar
      - run: gradle packageExePlain -Plaunch4jDir=$LAUNCH4J_DIR
      - run: gradle packageWindowsDist -Plaunch4jDir=$LAUNCH4J_DIR

      # ── Release ───────────────────────────────────────────────────────────────

      - run: echo "previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_ENV

      - name: Generate Changelog
        id: changelog
        uses: jaywcjlove/changelog-generator@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          head-ref: ${{ steps.changelog.outputs.version }}
          original-markdown: true
          filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'

      - name: Generate Changelog (path test)
        id: changelog_path
        uses: jaywcjlove/changelog-generator@main
        with:
          path: ./.github/workflows/changelog.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          head-ref: ${{steps.changelog.outputs.version}}
          original-markdown: true
          filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'

      - name: Generate Changelog (outputs.changelog)
        run: echo "${{ steps.changelogEmoji.outputs.changelog }}"

      - name: Generate Changelog(main)
        uses: jaywcjlove/changelog-generator@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          custom-emoji: 'chore💻'
          filter: '[R|r]elease[d]\s+[v|V]\d(\.\d+){0,2}'

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ steps.changelog.outputs.version }}
          tag: ${{ steps.changelog.outputs.version }}
          artifacts: |
            build/libs/ServerMaster.jar
            build/dist/ServerMaster.exe
            build/dist/ServerMaster-Bundled.zip
          artifactContentType: "application/octet-stream"
          body: |
            ${{ steps.changelog.outputs.compareurl }}

            ${{ steps.changelog.outputs.changelog }}
